# Private lab: the host publish in compose.yaml is restricted to loopback.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cache-Control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Re-resolve the API when a container is recreated with a different IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:5001;
    location = /api { proxy_pass $api_upstream; }
    location ^~ /api/ { proxy_pass $api_upstream; }
    location ^~ /health/ { proxy_pass $api_upstream; }
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location ^~ /static/ { try_files $uri =404; }
    location / { return 404; }
}
