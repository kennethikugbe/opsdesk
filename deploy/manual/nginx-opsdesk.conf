# Private local lab only. This is not a public or production-ready site.
# Installed as a site under /etc/nginx/sites-enabled after reviewing every
# other enabled site; do not start Nginx with the distro default site active.
server {
    listen 127.0.0.1:8081;
    server_name _;
    server_tokens off;

    root /var/www/opsdesk;
    index index.html;

    # Apply consistent headers to the static frontend and proxied responses.
    # Hide matching backend headers so each appears only once at the proxy.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cache-Control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api {
        proxy_pass http://127.0.0.1:5001;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5001;
    }
    location ^~ /health/ {
        proxy_pass http://127.0.0.1:5001;
    }
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location ^~ /static/ {
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
